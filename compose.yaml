services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    init: true

# backend и db будут добавлены при появлении реализации.
volumes:
  frontend_node_modules:
