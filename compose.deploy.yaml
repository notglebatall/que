name: que

services:
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "${QUE_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
